<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
 
 <body>
       <div class="login">

           <form id="loginpage">

            <label for="username">Username or Phone no.</label><br>

            <button style="color: white;" id="loginbtn">Login</button>

      

            <a href="ForgotPassword.html">Forgot Password?</a>

        </form>
    
       </div>
</body>
</head>
</html>
